name: Android APK Oluştur

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub reposunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Proje ZIP dosyasını bul ve aç
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP dosyası bulunamadı!"
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f -name "package.json" \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "package.json bulunamadı!"
            exit 1
          fi

          echo "Proje klasörü: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: NPM paketlerini kur
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          npm install

      - name: Web uygulamasını oluştur
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          npm run build

      - name: Capacitor Android platformunu ekle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor senkronizasyonu
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          npx cap sync android

      - name: AdMob App ID ekle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i '/<application/i\
    <meta-data\
        android:name="com.google.android.gms.ads.APPLICATION_ID"\
        android:value="ca-app-pub-3940256099942544~3347511713" />' "$MANIFEST"
          fi

      - name: Android APK oluştur
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
