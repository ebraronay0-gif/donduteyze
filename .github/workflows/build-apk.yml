name: Build Döndü Teyze Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub reposunu indir
        uses: actions/checkout@v4

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: NPM paketlerini kur
        run: npm install

      - name: Web uygulamasını oluştur
        run: npm run build

      - name: Capacitor Android platformunu ekle
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor Android senkronizasyonu
        run: npx cap sync android

      - name: Android APK oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
