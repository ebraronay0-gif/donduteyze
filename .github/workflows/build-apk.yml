name: Android APK Oluştur

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub reposunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: ZIP dosyasını bul ve aç
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "HATA: ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "ZIP bulundu: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "package.json" \
            -print \
            -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: package.json bulunamadı."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 3 -type f | head -50
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Proje klasörü: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: NPM paketlerini kur
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install

      - name: Web uygulamasını oluştur
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm run build

      - name: Capacitor Android ekle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android klasörü zaten mevcut."
          fi

      - name: Capacitor senkronizasyonu
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: AdMob App ID ekle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "HATA: AndroidManifest.xml bulunamadı."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          app_id = "ca-app-pub-3940256099942544~3347511713"

          if "com.google.android.gms.ads.APPLICATION_ID" in text:
              print("AdMob App ID zaten mevcut.")
          else:
              application_pos = text.find("<application")

              if application_pos == -1:
                  raise SystemExit("HATA: <application> etiketi bulunamadı.")

              application_end = text.find(">", application_pos)

              if application_end == -1:
                  raise SystemExit("HATA: <application> etiketi bozuk.")

              meta = (
                  "\n        <meta-data\n"
                  "            android:name=\"com.google.android.gms.ads.APPLICATION_ID\"\n"
                  f"            android:value=\"{app_id}\" />"
              )

              text = (
                  text[:application_end + 1]
                  + meta
                  + text[application_end + 1:]
              )

              manifest.write_text(text)
              print("AdMob test App ID eklendi.")
          PY

      - name: Android APK oluştur
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
