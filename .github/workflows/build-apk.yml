name: Android APK Oluştur

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub reposunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: ZIP dosyasını bul ve aç
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "HATA: ZIP dosyası bulunamadı!"
            exit 1
          fi

          echo "ZIP bulundu: $ZIP"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -o "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: package.json bulunamadı!"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Proje klasörü: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: NPM paketlerini kur
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "package.json:"
          cat package.json

          npm install

      - name: Web uygulamasını oluştur
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm run build

      - name: Capacitor Android platformunu ekle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android klasörü zaten mevcut."
          fi

      - name: Capacitor senkronizasyonu
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap sync android

      - name: AdMob App ID ekle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest
