name: Build Döndü Teyze Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub reposunu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasını bul ve aç
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          shopt -s dotglob
          ITEMS=(extracted/*)

          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            cp -R "${ITEMS[0]}"/. .
          else
            cp -R extracted/. .
          fi

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: NPM paketlerini kur
        run: npm install

      - name: Web uygulamasını oluştur
        run: npm run build

      - name: Capacitor Android platformunu ekle
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platformu zaten mevcut."
          fi

      - name: Capacitor Android senkronizasyonu
        run: npx cap sync android

      - name: Android APK oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: dondutezyze-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
