name: Build Döndü Teyze Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub deposunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: ZIP dosyasını bul
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "ZIP bulundu: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: ZIP dosyasını aç
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project

      - name: Proje klasörünü bul
        shell: bash
        run: |
          PROJECT_DIR=$(find project -type f -name "package.json" \
            -not -path "*/node_modules/*" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: package.json bulunamadı."
            exit 1
          fi

          echo "Proje klasörü: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM paketlerini kur
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Web uygulamasını oluştur
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Capacitor Android senkronizasyonu
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Android APK oluştur
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını GitHub'a yükle
        uses: actions/upload-artifact@v4
        with:
          name: donduteyze-test-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
